# META_ARC: "siamcar_r50"
META_ARC: "siamnca_r50"

BACKBONE:
    TYPE: "resnet50"
    KWARGS:
        used_layers: [2, 3, 4]
    PRETRAINED: '/mnt/5806372b-b6f4-4a6f-b765-8f5d513855a8/SiamCAR-master/pretrained_models/resnet50.model'
    TRAIN_LAYERS: ['layer2','layer3','layer4']
    TRAIN_EPOCH: 10
    LAYERS_LR: 0.1

ADJUST:
    ADJUST: true
    TYPE: "AdjustAllLayer"
    KWARGS:
        in_channels: [512, 1024, 2048]
        out_channels: [256, 256, 256]


TRACK:
    # TYPE: 'SiamCARTracker'
    TYPE: 'SiamNCATracker'
    PENALTY_K: 0.04
    WINDOW_INFLUENCE: 0.44
    LR: 0.33
    EXEMPLAR_SIZE: 127
    INSTANCE_SIZE: 255
    CONTEXT_AMOUNT: 0.5
    STRIDE: 8

ANCHOR:
    STRIDE: 8
    RATIOS: [0.33, 0.5, 1, 2, 3]
    SCALES: [8]
    ANCHOR_NUM: 5

TRAIN:
    EPOCH: 20
    START_EPOCH: 0
    BATCH_SIZE: 128 # 32
    BASE_LR: 0.005
    CLS_WEIGHT: 1.0
    LOC_WEIGHT: 3.0
    CEN_WEIGHT: 1.0
    RESUME: ''
    # RESUME: '/mnt/5806372b-b6f4-4a6f-b765-8f5d513855a8/SiamCAR-master/tools/snapshot/checkpoint_e5.pth'
    NUM_CLASSES: 2
    NUM_CONVS: 4
    PRIOR_PROB: 0.01
    OUTPUT_SIZE: 25 # 31

    LR:
        TYPE: 'log'
        KWARGS:
            start_lr: 0.005
            end_lr: 0.00005
    LR_WARMUP:
        TYPE: 'step'
        EPOCH: 5
        KWARGS:
            start_lr: 0.001
            end_lr: 0.005
            step: 1
    # LR:
    #     TYPE: 'log'
    #     KWARGS:
    #         start_lr: 0.0005
    #         end_lr: 0.00005
    # LR_WARMUP:
    #     TYPE: 'step'
    #     EPOCH: 5
    #     KWARGS:
    #         start_lr: 0.001
    #         end_lr: 0.0005
    #         step: 1

DATASET:
    NAMES: ['VID']
    # - 'YOUTUBEBB'
    # - 'COCO'
    # - 'DET'
    # - 'GOT'
    # - 'LaSOT'
    # - 'TKN'

    TEMPLATE:
        SHIFT: 4
        SCALE: 0.05
        BLUR: 0.0
        FLIP: 0.0
        COLOR: 1.0

    SEARCH:
        SHIFT: 64
        SCALE: 0.18
        BLUR: 0.2
        FLIP: 0.0
        COLOR: 1.0

    NEG: 0.0
    GRAY: 0.0
